buildscript {
    // Gradlex 1.0.3 embeds an older descriptor-tool graph. Align its build-only
    // dependencies on reviewed patches; never force these versions on consumers.
    configurations.classpath.resolutionStrategy.eachDependency {
        def pins = [
            'com.google.guava:guava': libs.versions.guava.get(),
            'org.jsoup:jsoup': libs.versions.jsoup.get(),
            'org.codehaus.plexus:plexus-utils': libs.versions.plexusUtils.get(),
            'org.codehaus.plexus:plexus-archiver': libs.versions.plexusArchiver.get(),
            'org.apache.commons:commons-lang3': libs.versions.commonsLang.get()]
        if (pins.containsKey(requested.group + ':' + requested.name))
            useVersion(pins[requested.group + ':' + requested.name])
    }
}

plugins {
    id 'maven-publish'
    alias(libs.plugins.maven.plugin.development)
}

project.setDescription('Validate prompt contracts, protect version history and generate typed Java models in Maven builds.')
java { withJavadocJar() }

mavenPlugin {
    artifactId = 'promptjig-maven-plugin'
    name = 'Promptjig Maven plugin'
    goalPrefix = 'promptjig'
    // Gradle project names differ from their published artifactIds. Maven resolves the runtime
    // from the publication POM; do not put Gradle's :core project name into plugin.xml coordinates.
    dependencies = configurations.detachedConfiguration()
}

dependencies {
    constraints {
        // Maven API's default transitive version is vulnerable. Patch the actual
        // producer compile/test classpaths; this does not replace a consumer's Maven installation.
        compileOnly(libs.guava)
        testImplementation(libs.guava)
    }
    implementation project(':core')
    compileOnly libs.maven.plugin.api
    compileOnly libs.maven.core
    compileOnly libs.maven.plugin.annotations
    compileOnly libs.lombok
    annotationProcessor libs.lombok
    testImplementation libs.maven.plugin.api
    testImplementation libs.maven.core
    testCompileOnly libs.maven.plugin.annotations
    testImplementation platform(libs.junit.bom.get())
    testImplementation libs.junit.jupiter
    testCompileOnly libs.lombok
    testAnnotationProcessor libs.lombok
    testRuntimeOnly libs.junit.platform.launcher
}

// The same fictional public-announcement contract exercises both build-tool adapters.
tasks.named('processTestResources', ProcessResources) {
    from(rootProject.file('examples/runtime/src/main/resources')) { include 'prompts/**'; into 'contract-testdata' }
    from(rootProject.file('examples/runtime/prompt-contracts.lock.json')) { into 'contract-testdata' }
}

tasks.named('test') {
    dependsOn tasks.named('jar')
    systemProperty 'promptjig.mavenPluginJar', tasks.named('jar').flatMap { it.archiveFile }.get().asFile.absolutePath
    systemProperty 'promptjig.candidateVersion', project.version.toString()
}

def providedMavenVersion = libs.versions.mavenApi.get()

publishing {
    publications.register('mavenPlugin', MavenPublication) {
        from components.java
        artifactId = 'promptjig-maven-plugin'
        pom {
            packaging = 'maven-plugin'
            name = 'Promptjig Maven plugin'
            pom.description.set(project.description)
            url = 'https://github.com/sjacek/promptjig'
            licenses { license { name = 'MIT'; url = 'https://opensource.org/license/mit' } }
            developers { developer { id = 'sjacek'; name = 'Jacek Sztajnke'; url = 'https://github.com/sjacek' } }
            scm { url = 'https://github.com/sjacek/promptjig'; connection = 'scm:git:https://github.com/sjacek/promptjig.git' }
            withXml {
                // Maven API belongs to the host class realm, never to the plugin's runtime dependencies.
                Node node = asNode()
                node.appendNode('prerequisites').appendNode('maven', '3.9.0')
                Node dependenciesNode = node.getAt('dependencies').get(0) as Node
                for (String artifact : ['maven-plugin-api', 'maven-core']) {
                    def host = dependenciesNode.appendNode('dependency')
                    host.appendNode('groupId', 'org.apache.maven')
                    host.appendNode('artifactId', artifact)
                    host.appendNode('version', providedMavenVersion)
                    host.appendNode('scope', 'provided')
                }
            }
        }
    }
    repositories { maven { name = 'staging'; url = layout.buildDirectory.dir('staging-repository') } }
}

apply from: rootProject.file('gradle/central-publication.gradle')
