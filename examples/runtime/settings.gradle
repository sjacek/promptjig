pluginManagement {
    repositories { gradlePluginPortal() }
    // Resolve the implementation module through the composite substitutions below, including unreleased versions.
    // A marker lookup alone could silently use the Portal's old plugin alongside a newer local runtime.
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'io.github.sjacek.promptjig')
                useModule("io.github.sjacek.promptjig:promptjig-gradle-plugin:${requested.version}")
        }
    }
}

// One included build supplies both the plugin and runtime; registering it twice can discard substitutions.
def checkout = file(providers.gradleProperty('promptjigBuildDir').getOrElse('../..'))
dependencyResolutionManagement {
    repositories { mavenCentral() }
    versionCatalogs { libs { from(files(new File(checkout, 'gradle/libs.versions.toml'))) } }
}
includeBuild(checkout) {
    dependencySubstitution {
        substitute module('io.github.sjacek.promptjig:promptjig-gradle-plugin') using project(':gradle-plugin')
        substitute module('io.github.sjacek.promptjig:promptjig-core') using project(':core')
        substitute module('io.github.sjacek.promptjig:promptjig-spring-ai') using project(':spring-ai')
    }
}
rootProject.name = 'promptjig-runtime-pilot'
