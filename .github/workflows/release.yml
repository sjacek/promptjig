name: Publish plugin

on:
  # A push/tag never uploads by itself; the owner dispatches a reviewed, existing tag explicitly.
  # The exact tagged commit must pass every Compatibility and security job.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  publish:
    if: github.repository == 'sjacek/promptjig'
    runs-on: ubuntu-latest
    environment: plugin-portal
    # Keep publishing keys scoped to the two Portal steps, not checkout, build or the tag guard.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          # Full tag history is required by the guard; checkout must not leave Git credentials in this tree.
          persist-credentials: false
      - run: chmod +x gradlew
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          # Publishing is deliberately separate from the download-only compatibility snapshot.
          cache-disabled: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        # noinspection UndefinedParamsPresent
        with:
          python-version: '3.12'
      - name: Verify immutable release reference
        id: verify_release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Quiet, uncached output is the version only; an empty value must not admit a tag named "v".
          version="$(./gradlew -q printVersion --no-configuration-cache)"
          test -n "$version"
          test "$RELEASE_TAG" = "v$version"
          # Resolve separately so either Git failure stops immediately; ^{commit} accepts both tag kinds.
          tag_commit="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          test "$tag_commit" = "$head_commit"
          # Check tracked files and the index before any build or authenticated Portal call.
          git diff --exit-code
          git diff --cached --exit-code
      - name: Require all Compatibility and security jobs on the exact tagged commit
        id: verify_ci
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: RELEASE_COMMIT="$(git rev-parse HEAD)" python3 -B scripts/central_publication.py ci
      - uses: ./.github/actions/restore-publication-sboms
        # Declared by the local composite action; the IDE may not resolve its inputs.
        # noinspection UndefinedParamsPresent
        with:
          run-id: ${{ steps.verify_ci.outputs.compatibility-run-id }}
      - name: Build and verify reviewed sources
        id: build
        run: ./gradlew check assemble :core:spike --console=plain
      - name: Verify audited SBOMs against the rebuilt release bytes
        run: python3 -B scripts/publication_sboms.py verify
      - name: Validate Plugin Portal publication without upload
        id: validate_portal
        run: ./gradlew :gradle-plugin:publishPlugins --validate-only -PpublicationSboms=true --console=plain
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
      - name: Publish reviewed plugin to Plugin Portal
        id: publish_portal
        # Default success() gating is intentional: a failed tag guard, build or validation blocks upload.
        run: ./gradlew :gradle-plugin:publishPlugins -PpublicationSboms=true --console=plain
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
