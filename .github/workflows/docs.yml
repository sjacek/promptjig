name: User documentation

on:
  push:
    paths:
      - 'docs/user-docs/**'
      - 'scripts/validate_user_docs.py'
      - 'scripts/test_user_docs.py'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/user-docs/**'
      - 'scripts/validate_user_docs.py'
      - 'scripts/test_user_docs.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: user-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check user guide
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # noinspection UndefinedParamsPresent
        with:
          persist-credentials: false
      - name: Test documentation checks
        run: python3 -B -m unittest discover -s scripts -p test_user_docs.py -v
      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        # noinspection UndefinedParamsPresent
        with:
          source: ./docs/user-docs
          destination: ./build/user-docs
      - name: Validate rendered pages and internal anchors
        run: python3 -B scripts/validate_user_docs.py build/user-docs --baseurl /promptjig
      - name: Upload checked Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        # noinspection UndefinedParamsPresent
        with:
          path: ./build/user-docs

  deploy:
    name: Publish user guide
    if: github.repository == 'sjacek/promptjig' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy checked artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
