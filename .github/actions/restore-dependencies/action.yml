name: Restore verified dependency snapshot
description: Restore only downloads from this run and recreate verified Gradle and Maven installations.
runs:
  using: composite
  # Inputs match the pinned action metadata; the IDE does not always resolve SHA references.
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7, same pin as ShardPilot
      # noinspection UndefinedParamsPresent
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
      # noinspection UndefinedParamsPresent
      with:
        name: ci-dependencies
        path: build
    - shell: bash
      run: |
        set -euo pipefail
        python3 -B scripts/ci_dependency_cache.py restore --required
        python3 -B scripts/ci_dependency_cache.py prepare
        python3 -B scripts/ci_dependency_cache.py distributions
